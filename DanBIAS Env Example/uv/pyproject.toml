[project]
name = "analysis"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Jeppe Klitgaard", email = "hi@jeppe.science" }
]
requires-python = "==3.14.*"
dependencies = [
    "qim3d>=1.6.0",
]

# Not present since people should set this according to their own needs
